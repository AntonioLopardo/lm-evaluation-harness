task: farstail
dataset_path: ParsiAI/FarsTail
output_type: multiple_choice
test_split: test
validation_split: validation
doc_to_text: "فرض: {{premise}}\nفرضیه: {{hypothesis}}\nآیا این فرضیه درست، نادرست یا نامشخص است؟"
doc_to_target: "{{{'e': 0, 'n': 1, 'c': 2}[label]}}"
doc_to_choice:
  - "درست"       # entailment (e)
  - "نامشخص"    # neutral (n)
  - "نادرست"     # contradiction (c)
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
