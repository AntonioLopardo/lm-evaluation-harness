# Base template for IndicGLUE COPA tasks
dataset_path: ai4bharat/indic_glue
output_type: multiple_choice
training_split: train
validation_split: validation
test_split: test
doc_to_target: label
doc_to_choice: !function utils.copa_doc_to_choice
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
