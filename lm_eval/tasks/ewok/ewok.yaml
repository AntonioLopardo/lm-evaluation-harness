task: ewok
dataset_path: ewok-core/ewok-core-1.0
output_type: multiple_choice
test_split: test
process_docs: !function utils.process_docs
doc_to_text: "{{context}}"
doc_to_target: "{{label}}"
doc_to_choice: "{{[target_correct, target_incorrect]}}"
should_decontaminate: true
doc_to_decontamination_query: "{{context}} {{target_correct}} {{target_incorrect}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
