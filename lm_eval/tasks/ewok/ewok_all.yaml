# EWoK: Elements of World Knowledge
# Paper: https://arxiv.org/abs/2405.09605
# Dataset: https://huggingface.co/datasets/ewok-core/ewok-core-1.0
#
# Evaluates world knowledge through minimal contrast pairs.
# Each context-target pair is evaluated for whether the model
# assigns higher probability to the correct continuation.
task: ewok_all
dataset_path: ewok-core/ewok-core-1.0
output_type: multiple_choice
test_split: test
process_docs: !function utils.process_docs
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target
doc_to_choice: !function utils.doc_to_choice
should_decontaminate: true
doc_to_decontamination_query: "{{context}} {{target_correct}} {{target_incorrect}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
