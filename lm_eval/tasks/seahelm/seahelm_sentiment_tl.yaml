task: seahelm_sentiment_tl
tag:
  - seahelm
  - seahelm_sentiment
  - sentiment
  - tagalog
dataset_path: aisingapore/NLU-Sentiment-Analysis
dataset_name: tl
output_type: multiple_choice
test_split: eval
process_docs: !function utils.process_sentiment_docs
doc_to_text: "Suriin ang damdamin ng sumusunod na teksto:\n{{text}}\nDamdamin:"
doc_to_target: !function utils.sentiment_doc_to_target
doc_to_choice:
  - "Positibo"
  - "Negatibo"
  - "Neutral"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
