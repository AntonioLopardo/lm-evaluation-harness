task: viquad
dataset_path: taidng/UIT-ViQuAD2.0
output_type: generate_until
training_split: train
validation_split: validation
# Note: test split has hidden labels, using validation for evaluation
doc_to_text: "Bối cảnh: {{context}}\n\nCâu hỏi: {{question}}\n\nTrả lời:"
doc_to_target: "{{answers.text[0] if answers and answers.text else 'không có câu trả lời'}}"
process_results: !function utils.process_results_viquad
generation_kwargs:
  until:
    - "\n"
  do_sample: false
  temperature: 0.0
  max_gen_toks: 128
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
  - metric: f1
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
