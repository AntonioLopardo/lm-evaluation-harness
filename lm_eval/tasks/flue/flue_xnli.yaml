task: flue_xnli
dataset_path: GETALP/flue
dataset_name: XNLI
dataset_kwargs:
  trust_remote_code: true
output_type: multiple_choice
training_split: train
validation_split: validation
test_split: test
doc_to_text: "{{premise}}\nQuestion: {{hypo}} Vrai, Neutre, ou Faux?\nRéponse:"
# 0 = contradiction, 1 = entailment, 2 = neutral
doc_to_target: "{{label}}"
doc_to_choice:
  - "Faux"       # contradiction (0)
  - "Vrai"       # entailment (1)
  - "Neutre"     # neutral (2)
should_decontaminate: true
doc_to_decontamination_query: premise
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
