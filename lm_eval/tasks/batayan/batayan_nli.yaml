task: batayan_nli
dataset_path: aisingapore/NLR-NLI
dataset_name: tl
output_type: multiple_choice
test_split: eval
doc_to_text: !function utils.doc_to_text_nli
doc_to_target: !function utils.doc_to_target_nli
doc_to_choice: !function utils.doc_to_choice_nli
