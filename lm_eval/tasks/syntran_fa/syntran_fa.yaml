task: syntran_fa
dataset_path: SLPL/syntran-fa
output_type: generate_until
test_split: train
doc_to_text: "سوال: {{question}}\n\nپاسخ:"
doc_to_target: "{{short_answer}}"
generation_kwargs:
  until:
    - "\n"
    - "سوال:"
  max_gen_toks: 64
process_results: !function utils.process_results
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
