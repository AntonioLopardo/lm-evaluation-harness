# Template for LMentry multiple-choice tasks
# These tasks have an 'answer' field and are evaluated with loglikelihood
dataset_path: clembench-playpen/lmentry
dataset_kwargs:
  trust_remote_code: true
test_split: test
output_type: generate_until
doc_to_text: "{{input}} Answer with just the answer, nothing else:"
doc_to_target: "{{answer}}"
process_results: !function utils.process_results_mc
generation_kwargs:
  until:
    - "\n"
    - "."
    - ","
  max_gen_toks: 20
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
