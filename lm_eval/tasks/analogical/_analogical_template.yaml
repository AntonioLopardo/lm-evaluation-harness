dataset_path: relbert/analogy_questions
output_type: multiple_choice
test_split: test
validation_split: validation
doc_to_text: !function utils.format_stem
doc_to_target: "{{answer}}"
doc_to_choice: !function utils.format_choices
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
