task: clue_cmnli
dataset_path: clue/clue
dataset_name: cmnli
dataset_kwargs:
  trust_remote_code: true
output_type: multiple_choice
test_split: validation
doc_to_text: "前提: {{sentence1}}\n假设: {{sentence2}}\n这个假设是正确的、错误的还是不确定的？"
doc_to_target: "{{label}}"
doc_to_choice:
  - "正确"      # entailment (0)
  - "不确定"    # neutral (1)
  - "错误"      # contradiction (2)
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
