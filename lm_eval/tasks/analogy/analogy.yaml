task: analogy
dataset_path: almogtavor/google-analogy-dataset
output_type: generate_until
test_split: train
doc_to_text: "Complete the analogy.\n{{Word1}} is to {{Word2}} as {{Word3}} is to"
doc_to_target: " {{Word4}}"
generation_kwargs:
  until:
    - "\n"
    - "."
  max_gen_toks: 10
  do_sample: false
  temperature: 0.0
filter_list:
  - name: "remove-whitespace"
    filter:
      - function: "remove_whitespace"
      - function: "take_first"
should_decontaminate: true
doc_to_decontamination_query: "{{Word1}} {{Word2}} {{Word3}}"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
metadata:
  version: 1.0
