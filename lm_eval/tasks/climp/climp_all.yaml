# CLiMP: Chinese Linguistic Minimal Pairs
# Dataset: https://huggingface.co/datasets/suchirsalhan/CLiMP
#
# BLiMP-style grammaticality judgments for Chinese.
# Tests whether model assigns higher probability to grammatical sentences.
#
# Note: ba_construction subset is skipped due to broken CSV format.
task: climp_all
custom_dataset: !function utils.load_climp_dataset
output_type: multiple_choice
test_split: test
doc_to_text: ""
doc_to_target: 0
doc_to_choice: "{{[sentence_good, sentence_bad]}}"
should_decontaminate: true
doc_to_decontamination_query: "{{sentence_good}} {{sentence_bad}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
