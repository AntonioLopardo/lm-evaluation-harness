task: seacrowd_indolem_sentiment
tag:
  - seacrowd
  - sentiment
  - indonesian
dataset_path: SEACrowd/indolem_sentiment
dataset_name: null
dataset_kwargs:
  trust_remote_code: true
output_type: multiple_choice
training_split: train
validation_split: validation
test_split: test
doc_to_text: "Analisis sentimen dari teks berikut:\n{{sentence}}\nApakah sentimen teks ini Negatif atau Positif?\nJawaban:"
# 0 = Negatif (negative)
# 1 = Positif (positive)
doc_to_target: sentiment
doc_to_choice:
  - "Negatif"
  - "Positif"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
