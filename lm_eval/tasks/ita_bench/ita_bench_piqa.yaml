# ITA-Bench: PIQA (Italian)
# Source: https://huggingface.co/datasets/sapienzanlp/piqa_italian
task: ita_bench_piqa
dataset_path: sapienzanlp/piqa_italian
output_type: multiple_choice
validation_split: validation
doc_to_text: "Domanda: {{input_translation}}\nRisposta:"
doc_to_target: "{{label}}"
doc_to_choice: "{{choices_translation}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  - metric: acc_norm
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
