dataset_path: boun-tabi/nli_tr
dataset_kwargs:
  trust_remote_code: true
output_type: multiple_choice
test_split: test
doc_to_text: "Önerme: {{premise}}\nHipotez: {{hypothesis}}\nBu hipotez önermeyle ilişkili olarak doğru mu, yanlış mı yoksa belirsiz mi?"
doc_to_target: "{{label}}"
doc_to_choice:
  - "Doğru"      # entailment (0)
  - "Belirsiz"   # neutral (1)
  - "Yanlış"     # contradiction (2)
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
