# Thai Winograd Schema task
# Dataset: https://huggingface.co/datasets/pakphum/winograd_th
#
# The task evaluates coreference resolution by asking which entity a pronoun refers to.
# Format: Given a sentence with a pronoun, choose which of two options the pronoun refers to.
task: winograd_th
dataset_path: pakphum/winograd_th
output_type: multiple_choice
test_split: test
doc_to_text: !function utils.doc_to_text
doc_to_target: !function utils.doc_to_target
doc_to_choice: !function utils.doc_to_choice
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
